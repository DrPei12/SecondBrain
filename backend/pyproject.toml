[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain-rag"
version = "0.1.0"
description = "SecondBrain product RAG service with REST and CLI entry points"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.109.0",
  "uvicorn[standard]==0.27.0",
  "sqlalchemy>=2.0.25,<3",
  "aiosqlite>=0.19.0",
  "pydantic>=2.5.3,<3",
  "pydantic-settings>=2.1.0,<3",
  "python-dotenv>=0.21.0",
  "openai>=1.0.0",
  "lightrag-hku==1.4.11",
]

[project.scripts]
secondbrain-rag = "app.cli.rag:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
